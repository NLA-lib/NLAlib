name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, lint, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Find a compatible build from successful main CI
        id: build-cache
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci_build_cache.py select
      - name: Download the verified main build
        id: download-build
        if: steps.build-cache.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.build-cache.outputs.name }}
          run-id: ${{ steps.build-cache.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/lean-build-cache
      - name: Verify and restore the build artifact
        if: steps.download-build.outcome == 'success'
        env:
          CACHE_SHA: ${{ steps.build-cache.outputs.sha }}
          CACHE_RUN_ID: ${{ steps.build-cache.outputs.run_id }}
          CACHE_RUN_ATTEMPT: ${{ steps.build-cache.outputs.run_attempt }}
        run: python3 scripts/ci_build_cache.py restore --directory "$RUNNER_TEMP/lean-build-cache"
      - name: Build NLAlib with the Mathlib cache; warnings are fatal
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--wfail --rehash NLAlib"
          lint: false
          test: false
          # Generic branch-scoped caches stay off. Only the verified main artifact above
          # supplies build outputs; --rehash rebuilds changed sources and their dependents.
          use-github-cache: false
      - name: Root module is current
        run: lake exe mk_all --lib NLAlib --check
      - name: Axiom audit (import NLAlib is sorry-free, no unsafe or partial constant)
        run: lake env lean scripts/Audit.lean
      - name: Environment linters
        run: lake env lean scripts/Lint.lean
      - name: Fixed Ops programs, canonical certificates, and structural fixtures (E2)
        run: lake env lean scripts/OpsPrograms.lean
      - name: Tools library builds (NLAlibTools; not part of the library, may contain sorry)
        run: |
          lake build --rehash NLAlibTools
          lake exe mk_all --lib NLAlibTools --check
      - name: Build outputs are current (every hash recomputed)
        run: lake build --no-build --rehash NLAlib NLAlibTools
      - name: Kernel replay (every constant of every lean_lib re-checked by the kernel)
        run: lake env lean scripts/Replay.lean
      - name: Kernel replay fixtures (each forgery of the final audits is rejected)
        run: bash scripts/replay_fixtures.sh
      - name: Reference keys resolve
        run: python3 scripts/check_refs.py
      - name: Generated rule files are current (docs/rules/rules.toml)
        run: python3 scripts/gen_rules_md.py --check
      - name: Documentation metadata regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Named bounds show their current values
        run: python3 scripts/check_constants.py
      - name: Extract the declaration data (about a minute on the built library)
        run: bash scripts/explore_data.sh "$RUNNER_TEMP/explore-data.json"
      - name: Contribution rules by id, names (N1-N18) included, ratcheted (scripts/check_rules.py)
        run: python3 scripts/check_rules.py "$RUNNER_TEMP/explore-data.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Docstring LaTeX renders
        run: npm install --no-save --no-package-lock katex@0.16.22 && node scripts/check_latex.mjs
      - name: LaTeX checker regressions
        run: node --test scripts/test_check_latex.mjs
      - name: Package the checked build for future runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/ci_build_cache.py pack --directory "$RUNNER_TEMP/lean-build-save"
      - name: Save the checked main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-cache.outputs.save_name }}
          path: ${{ runner.temp }}/lean-build-save
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
  documentation-windows:
    name: Documentation regressions (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Documentation metadata regressions
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Install the documentation renderer
        run: npm install --no-save --no-package-lock katex@0.16.22
      - name: LaTeX checker regressions
        run: node --test scripts/test_check_latex.mjs
