# The rules of the contributor guide, one entry per id: the single source of the rule data.
# scripts/check_rules.py and scripts/check_names.py read severity, statement, fix and scope from it;
# scripts/gen_rules_md.py generates NLAlib/<Topic>/RULES.md and docs/rules/DIGEST.md from it
# (`--check` fails when they are stale). The prose, with the reasons, is in the guide at `section`.
# A new rule gets its entry here, its check, a fixture in scripts/test_check_rules.py and its id in
# brackets where the guide states it (docs/contributing/checks.md §2).
#
# id        area letter and number, never reused (retired: E1 on 2026-10-23, the witness of a
#           result being a first-order tree; E7, merged into E1; E3–E6, E8–E9 retired with
#           the old execution/registry system on 2026-11-13)
# area      the area of the letter
# severity  error (fails CI, ratcheted), warning (a heuristic, a review list) or review (no check)
# check     source (the sources and documents), extraction (needs scripts/explore_data.sh), lean
#           (the built library, by scripts/OpsPrograms.lean), none
# scope     "library", or the topic directories the rule applies to; exclude removes directories
# exempt    directories exempt while the rule `exempt_while` has no violation (optional), for
#           `exempt_reason`; NLAlib/<Topic>/RULES.md shows them
# home      topics that list a library-wide rule first in their RULES.md (optional)
# statement the rule, one line, read as the check's message
# fix       what to do about a violation
# section   where the guide states it: a guide of docs/contributing (`naming`, `statements §2 rule 3`)
#           or `CONTRIBUTING` for the hub, then optional words

[[rule]]
id = "A1"
area = "algorithm tags"
severity = "error"
check = "source"
scope = "library"
section = "docstrings item 4b"
statement = '''An `Algorithm:` tag is the docstring's last line, `Algorithm: <id>` or `Algorithm: <id> (<role>)`, the id a slug and the role `specification` or `run model`'''
fix = '''Put the tag alone on the last line, the id kebab-case like a result id (`cg`, `randomized-svd`)'''

[[rule]]
id = "A2"
area = "algorithm tags"
severity = "error"
check = "source"
scope = "library"
section = "docstrings item 4b"
statement = '''`Algorithm:` tags go on definitions, structures and programs, never on theorems or instances'''
fix = '''Delete it: a result reaches its algorithm page through its `Result:` id and its statement (the explorer's attachment rules)'''

[[rule]]
id = "A3"
area = "algorithm tags"
severity = "error"
check = "source"
scope = "library"
section = "docstrings item 4b"
statement = '''A declaration carries at most one `Algorithm:` tag'''
fix = '''Keep the algorithm the declaration defines; a shared building block is found through dependencies, not tagged twice'''

