fix = '''Rename by N15'''

[[rule]]
id = "N16"
area = "names"
severity = "error"
check = "extraction"
scope = ["NLAlib/LowRank", "NLAlib/Regression", "NLAlib/Sketching"]
section = "naming §4"
statement = '''A sample size is a named bound `<sketch><property>Dim`'''
fix = '''Rename it `…Dim`; the theorem assuming it is `_of_<size>_le`'''

[[rule]]
id = "N17"
area = "names"
severity = "error"
check = "extraction"
scope = "library"
section = "naming §4"
statement = '''An asymptotic form is `exists_forall_` + its explicit theorem's name, in the root namespace'''
fix = '''Derive the name by N17'''

[[rule]]
id = "N18"
area = "names"
severity = "error"
check = "extraction"
scope = "library"
section = "naming §2"
statement = '''A theorem whose first explicit argument is `hA : A.P` lives in namespace `P` (dot notation)'''
fix = '''Move it to the predicate's namespace and drop its `_of_<P>`'''

[[rule]]
id = "P1"
area = "placement and layers"
severity = "error"
check = "source"
scope = "library"
section = "layout §1"
statement = '''A module imports only its own layer and lower (the layer table); Krylov never imports Probability, Sketching never Regression, LowRank never Estimation'''
fix = '''Move the declaration to the layer it belongs to (layout and design guides)'''

[[rule]]
id = "P2"
area = "placement and layers"
severity = "error"
check = "source"
scope = "library"
section = "layout §1"
statement = '''No file with imports only (no per-directory aggregator); registration and executable audit commands count as content'''
fix = '''Delete import-only aggregators; a user imports the file they need'''

[[rule]]
id = "P3"
area = "placement and layers"
severity = "error"
check = "source"
scope = "library"
section = "proofs"
statement = '''An `NLAlib` file never imports `NLAlibScaffold`'''
fix = '''The scaffold is never imported by the library; move the proved declaration to `NLAlib/`'''

[[rule]]
id = "P4"
area = "placement and layers"
severity = "error"
check = "extraction"
scope = ["NLAlib/ForMathlib"]
section = "layout §1"
statement = '''A ForMathlib statement uses no NLAlib vocabulary'''
fix = '''Move it out of ForMathlib, to the topic file of that vocabulary'''

[[rule]]
id = "P5"
area = "placement and layers"
severity = "error"
check = "source"
scope = ["NLAlib/ForMathlib"]
section = "layout §1"
statement = '''A ForMathlib declaration is in the Mathlib namespace it would have upstream, never `NLAlib`'''
fix = '''Declare it in the Mathlib namespace it would have upstream'''

[[rule]]
id = "P6"
area = "placement and layers"
severity = "error"
check = "source"
scope = ["NLAlib/ForMathlib"]
section = "layout §1"
statement = '''A ForMathlib module docstring marks the file as an upstream candidate'''
fix = '''Say in the module docstring that its facts are upstream candidates'''

[[rule]]
id = "P7"
area = "placement and layers"
severity = "warning"
check = "source"
scope = ["NLAlib/ForMathlib"]
section = "layout §1"
statement = '''A ForMathlib file is named after the Mathlib file it would join'''
fix = '''Name the file after the Mathlib file it would join'''

[[rule]]
id = "P8"
area = "placement and layers"
severity = "error"
check = "source"
scope = "library"
exclude = ["NLAlib/ForMathlib"]
section = "layout §2"
statement = '''Outside ForMathlib a declaration is in `NLAlib`, or is API of a Mathlib hypothesis structure'''
fix = '''Put it in `namespace NLAlib`, or move a general fact to ForMathlib'''

[[rule]]
id = "P9"
area = "placement and layers"
severity = "warning"
check = "extraction"
scope = "library"
exclude = ["NLAlib/ForMathlib"]
exempt = ["NLAlib/Polynomial"]
exempt_while = "P11"
exempt_reason = '''its headline scalar results (Chebyshev residuals and minimax, approximation of $1/x$, interpolation of Stieltjes functions) stay in the layer, which can go upstream as a whole while it imports only Mathlib and ForMathlib'''
section = "layout §1"
statement = '''Review a theorem with no NLAlib, matrix or measure vocabulary as a possible ForMathlib candidate'''
fix = '''Move general mathematical facts to ForMathlib; review local structural helpers in the context of their layer'''

[[rule]]
id = "P10"
area = "placement and layers"
severity = "warning"
check = "extraction"
scope = "library"
exclude = ["NLAlib/ForMathlib"]
section = "design placement"
statement = '''A statement lives with its topic, not in a higher layer than its vocabulary'''
fix = '''Check that the file is where a user of its topic would look'''

[[rule]]
id = "P11"
area = "placement and layers"
severity = "error"
check = "source"
scope = ["NLAlib/Polynomial"]
section = "layout §1"
statement = '''A Polynomial file imports only Mathlib, `NLAlib.ForMathlib` and `NLAlib.Polynomial`'''
fix = '''Keep the Polynomial layer upstreamable: move what it needs to ForMathlib, or the declaration out of Polynomial'''

[[rule]]
id = "P12"
area = "placement and layers"
severity = "error"
check = "source"
scope = "library"
section = "proofs"
statement = '''An `NLAlib` file, the root `NLAlib.lean` included, never imports `NLAlibTools`, `NLAlibScaffold` or another `lean_lib` of lakefile.toml'''
fix = '''The library imports only itself, Mathlib and its dependencies: move what it needs into `NLAlib/` (scripts/Replay.lean trusts no module built by this package unchecked)'''

[[rule]]
id = "R1"
area = "result ids"
severity = "error"
check = "source"
scope = "library"
section = "docstrings item 4"
statement = '''`Result:` ids go on statements, never on definitions or structures'''
fix = '''Ids name statements of results (maintainer, 2026-10-19); delete it, or move it to the theorem that states the result'''

[[rule]]
id = "R2"
area = "result ids"
severity = "error"
check = "source"
scope = "library"
section = "docstrings item 4"
statement = '''No two result ids one or two edits apart'''
fix = '''Use the existing id; a deliberate variant goes on the allowlist'''

[[rule]]
id = "R3"
area = "result ids"
severity = "error"
check = "source"
scope = "library"
section = "explorer README"
statement = '''Every id or declaration the explorer names exists'''
fix = '''Restore it, or update the explorer'''

[[rule]]
id = "S1"
area = "source and proof style"
severity = "error"
check = "source"
scope = "library"
section = "proofs"
statement = '''No `simp_all`'''
fix = '''Use `simp only [...]`, `simp at h ⊢` or a term'''

[[rule]]
id = "S2"
area = "source and proof style"
severity = "error"
check = "source"
scope = "library"
section = "proofs"
statement = '''No search tactic left in (`exact?`, `apply?`, `rw?`, `simp?`, `aesop?`)'''
fix = '''Replace it by the proof term it suggests'''

[[rule]]
id = "S3"
area = "source and proof style"
severity = "warning"
check = "source"
scope = "library"
section = "proofs"
statement = '''`decide` only on tiny finite goals'''
fix = '''Prefer `simp`, `omega` or `fin_cases` on anything but a tiny goal'''

[[rule]]
id = "S4"
area = "source and proof style"
severity = "error"
check = "source"
scope = "library"
section = "proofs"
statement = '''A proof has at most 80 lines'''
fix = '''Split it into named lemmas'''

[[rule]]
id = "S5"
area = "source and proof style"
severity = "warning"
check = "source"
scope = "library"
section = "layout §2"
statement = '''A helper two files need is one public lemma, not two private copies'''
fix = '''Make it one public, documented lemma in the file that owns its subject'''

[[rule]]
id = "S6"
area = "source and proof style"
severity = "error"
check = "extraction"
scope = "library"
section = "proofs"
statement = '''No global instance on a Mathlib type, unless it is the one Mathlib would add'''
fix = '''Only an instance Mathlib would add itself; allowlist it with the reason, or make it local'''

[[rule]]
id = "S7"
area = "source and proof style"
severity = "error"
check = "source"
scope = "library"
section = "layout §2"
statement = '''A line has at most 100 characters, unless one identifier or a URL makes it long'''
fix = '''Wrap it; only a line that is one identifier or contains a URL may be longer, under `set_option linter.style.longLine false in` with a comment'''

[[rule]]
id = "S8"
area = "source and proof style"
severity = "error"
check = "source"
scope = "library"
section = "layout §2"
statement = '''`set_option linter.style.longLine false in` only on a declaration with a long line'''
fix = '''Remove the option'''

[[rule]]
id = "S9"
area = "source and proof style"
severity = "error"
check = "source"
scope = "library"
section = "proofs"
statement = '''No `unsafe`, `partial`, `implemented_by`, `extern`, `set_option debug.…`, kernel option or unchecked `addDeclCore` in the library or lakefile.toml'''
fix = '''Write a total, safe definition; never switch off or bypass the kernel check (scripts/Replay.lean re-checks every constant)'''

[[rule]]
id = "T1"
area = "types and statement shape"
severity = "error"
check = "extraction"
scope = "library"
section = "statements §1"
statement = '''The Euclidean norm is `‖WithLp.toLp 2 x‖`, never `√(x ⬝ᵥ x)`'''
fix = '''Write `‖WithLp.toLp 2 x‖`'''

[[rule]]
id = "T2"
area = "types and statement shape"
severity = "error"
check = "extraction"
scope = "library"
section = "statements §1"
statement = '''An `ℝ≥0` quantity in a statement is written with `‖·‖₊`, never `Real.toNNReal`'''
fix = '''Write the `ℝ≥0` quantity with `‖·‖₊`'''

[[rule]]
id = "T3"
area = "types and statement shape"
severity = "error"
check = "source"
scope = "library"
section = "statements §1"
statement = '''Only `Matrix.Norms.L2Operator` is opened, never `…Frobenius` or `…Elementwise`'''
fix = '''Use the named norms `frobNorm`, `specNorm`; only `Matrix.Norms.L2Operator` is opened'''

[[rule]]
id = "T4"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = "library"
section = "statements §1"
statement = '''Matrix norms in statements are named functions, not `‖A‖`'''
fix = '''Use a named norm (`specNorm`, `frobNorm`)'''

[[rule]]
id = "T5"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = "library"
section = "statements §1"
statement = '''Statements use `ᴴ`, not `ᵀ`'''
fix = '''State it with `ᴴ`; over ℝ, `conjTranspose_eq_transpose_of_trivial` converts'''

[[rule]]
id = "T6"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = ["NLAlib/Matrix"]
section = "statements §1"
statement = '''Matrix theorems are over `[Fintype n]` index types; `Fin` only where order or recursion matters'''
fix = '''Use `[Fintype n]` unless order or recursion carries content'''

[[rule]]
id = "T7"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = ["NLAlib/Matrix"]
section = "statements §1"
statement = '''Matrix theorems are over `[RCLike 𝕜]` where the proof allows, not ℝ only'''
fix = '''State it over `[RCLike 𝕜]` if the proof allows'''

[[rule]]
id = "T8"
area = "types and statement shape"
severity = "error"
check = "extraction"
scope = "library"
section = "statements §2"
statement = '''No statement quantifies over `eigenvectorBasis`'''
fix = '''Take an eigenvector `u` with `A *ᵥ u = c • u`, or an invariance equation'''

[[rule]]
id = "T9"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = "library"
section = "statements §2"
statement = '''Review opaque proof terms (`⋯` in the signature) for hidden assumptions or unreadable statements'''
fix = '''Expose mathematical assumptions as hypotheses; structural index and configuration evidence may remain inline'''

[[rule]]
id = "T10"
area = "types and statement shape"
severity = "error"
check = "extraction"
scope = "library"
section = "statements §2"
statement = '''A bound variable that meets `•` has its type written (`∀ θ : ℝ, …`)'''
fix = '''Write the variable's type (`∀ θ : ℝ, …`)'''

[[rule]]
id = "T11"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = "library"
section = "statements §2"
statement = '''A two-sided bound is two theorems, not a top-level conjunction'''
fix = '''Split two-sided bounds into two theorems'''

[[rule]]
id = "T12"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = "library"
home = ["NLAlib/Matrix"]
section = "statements §2"
statement = '''An `∃`-index into `eigenvalue` or `singularValues` carries its range'''
fix = '''Bound the index (`k < Fintype.card n`)'''

[[rule]]
id = "T13"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = "library"
section = "statements §2"
statement = '''Review hypotheses named `_h…` for unnecessary assumptions'''
fix = '''Drop genuinely unused hypotheses; an underscore name alone does not establish that its proof is unused'''

[[rule]]
id = "T14"
area = "types and statement shape"
severity = "warning"
check = "extraction"
scope = "library"
home = ["NLAlib/Probability", "NLAlib/RandomMatrix"]
section = "statements §2"
statement = '''Tails are stated in `μ.real`, not `μ {…}` in `ℝ≥0∞`'''
fix = '''State tails in `μ.real`'''

[[rule]]
id = "T15"
area = "types and statement shape"
severity = "error"
check = "source"
scope = "library"
section = "statements §2"
statement = '''A lower moment obtained by Jensen from a higher one is not a separate theorem'''
fix = '''Delete it: the higher-moment theorem's docstring says in a sentence that the source prints the lower-moment form, which follows by Jensen (`ProbabilityTheory.integral_le_sqrt_integral_sq`); it stays only if another proof uses it, allowlisted with "used by …" (maintainer, 2026-10-19)'''

[[rule]]
id = "V1"
area = "vocabulary"
severity = "error"
check = "extraction"
scope = "library"
section = "vocabulary"
statement = '''Orthonormal columns are `HasOrthonormalCols Q`, never a raw `Qᴴ * Q = 1`'''
fix = '''Take `HasOrthonormalCols Q`'''

[[rule]]
id = "V2"
area = "vocabulary"
severity = "error"
check = "extraction"
scope = "library"
section = "vocabulary"
statement = '''No truncated subtraction `Fintype.card n - k` in a statement'''
fix = '''Use an auxiliary `d` with `hd : k + d = Fintype.card n`'''

[[rule]]
id = "V3"
area = "vocabulary"
severity = "error"
check = "extraction"
scope = "library"
home = ["NLAlib/LowRank", "NLAlib/Krylov"]
section = "vocabulary"
statement = '''A singular-value ratio is `singularGapRatio`, never spelled out'''
fix = '''Use `singularGapRatio` (a bridge lemma relating the two is allowlisted)'''

[[rule]]
id = "V4"
area = "vocabulary"
severity = "error"
check = "extraction"
scope = "library"
section = "vocabulary"
statement = '''A squared Frobenius norm is `frobNorm A ^ 2`, never `frobNorm A * frobNorm A`'''
fix = '''Write `frobNorm A ^ 2`'''

[[rule]]
id = "V5"
area = "vocabulary"
severity = "error"
check = "source"
scope = "library"
section = "vocabulary"
statement = '''No forbidden spelling (`matrixExp`, `matrixLog`, `traceExp`, `lambdaMax`, `conditionNumber`)'''
fix = '''Use the vocabulary spelling'''

[[rule]]
id = "V6"
area = "vocabulary"
severity = "error"
check = "source"
scope = "library"
section = "vocabulary"
statement = '''Every Lean name cited in the contributor guides (except the naming guide) or Mathlib-deviations.md exists'''
fix = '''Update the document to the current name'''

[[rule]]
id = "V7"
area = "vocabulary"
severity = "warning"
check = "extraction"
scope = "library"
section = "vocabulary"
statement = '''A public definition has a vocabulary row, a Mathlib-deviations entry or an explorer support role'''
fix = '''A new concept gets a vocabulary row through its design note'''
